<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FaceTime</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="call-card" aria-label="Video call">
        <header class="top-bar">
          <div>
            <p class="eyebrow">FaceTime</p>
            <h1 id="contactName">Avery Johnson</h1>
          </div>
          <div class="call-status">
            <span class="status-dot" id="statusDot"></span>
            <span id="callStatus">Connected</span>
            <strong id="callTimer">00:00</strong>
          </div>
        </header>

        <div class="video-stage">
          <div class="remote-feed">
            <div class="avatar" id="remoteAvatar">AJ</div>
            <p id="remoteLabel">Avery is on the call</p>
          </div>
          <div class="reaction-burst" id="reactionBurst" aria-live="polite"></div>

          <div class="local-preview">
            <video id="localVideo" autoplay muted playsinline></video>
            <div class="camera-fallback" id="cameraFallback">Camera unavailable</div>
          </div>
        </div>

        <p class="permission-message" id="permissionMessage" hidden>
          Camera access is unavailable. You can still use the call controls.
        </p>

        <div class="controls" aria-label="Call controls">
          <button class="control-button" id="muteButton" type="button" aria-pressed="false">
            <span>🎙️</span>
            Mute
          </button>
          <button class="control-button" id="cameraButton" type="button" aria-pressed="false">
            <span>📹</span>
            Camera
          </button>
          <button class="control-button end-call" id="endButton" type="button">
            <span>☎️</span>
            End
          </button>
        </div>

        <div class="reactions" aria-label="Send a reaction">
          <button class="reaction-button" type="button" data-reaction="👍">👍</button>
          <button class="reaction-button" type="button" data-reaction="❤️">❤️</button>
          <button class="reaction-button" type="button" data-reaction="🎉">🎉</button>
          <button class="reaction-button" type="button" data-reaction="👏">👏</button>
        </div>
      </section>

      <aside class="contacts-panel" aria-label="Contacts">
        <h2>Contacts</h2>
        <p>Choose someone to call.</p>
        <div class="contact-list">
          <button class="contact active" type="button" data-name="Avery Johnson" data-initials="AJ">
            <span>AJ</span>
            Avery Johnson
          </button>
          <button class="contact" type="button" data-name="Mia Chen" data-initials="MC">
            <span>MC</span>
            Mia Chen
          </button>
          <button class="contact" type="button" data-name="Noah Patel" data-initials="NP">
            <span>NP</span>
            Noah Patel
          </button>
        </div>
      </aside>
    </main>

    <script src="index.js"></script>
  </body>
</html>
